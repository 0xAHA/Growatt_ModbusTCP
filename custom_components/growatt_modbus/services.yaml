get_register_data:
  name: Get Register Data
  description: Read specific Modbus registers for debugging
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device
      required: true
      selector:
        device:
          integration: growatt_modbus
    register_type:
      name: Register Type
      description: Type of registers to read
      default: "input"
      selector:
        select:
          options:
            - "input"
            - "holding"
    start_address:
      name: Start Address
      description: Starting register address
      default: 3000
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Register Count
      description: Number of registers to read
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box

export_register_dump:
  name: Universal Register Scanner
  description: >
    Scan ALL register ranges, auto-detect your inverter model, and export a complete register dump
    to CSV. Select a configured device below to automatically use its connection settings and include
    current entity values in the scan. Alternatively leave the device blank and enter connection
    parameters manually, to scan a second inverter or a different address on the same network.
    NOTE: this action only exists once at least one Growatt device has been added - Home
    Assistant does not load the integration before that. To scan an inverter that is not yet
    supported, add it first with any profile chosen manually; the scan sweeps every range
    regardless of which profile is configured.
    File saved to /config/growatt_register_scan_[timestamp].csv
  fields:
    config_entry:
      name: Device (recommended)
      description: >
        Select your Growatt inverter from the list. Connection details and current entity values
        are pulled directly from the integration — no manual IP/serial entry needed.
        Leave blank to enter connection parameters manually.
      required: false
      selector:
        config_entry:
          integration: growatt_modbus
    connection_type:
      name: Connection Type (manual only)
      description: Select TCP or Serial. Ignored when a device is selected above.
      required: false
      default: "tcp"
      selector:
        select:
          options:
            - label: "TCP (Ethernet)"
              value: "tcp"
            - label: "Serial (USB)"
              value: "serial"
    host:
      name: IP Address (manual TCP only)
      description: IP address of your RS485-TCP adapter. Ignored when a device is selected above.
      required: false
      example: "192.168.1.60"
      selector:
        text:
    port:
      name: Port (manual TCP only)
      description: Modbus TCP port (usually 502). Ignored when a device is selected above.
      required: false
      default: 502
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    device:
      name: Serial Device (manual Serial only)
      description: Serial port path for USB adapter (e.g. /dev/ttyUSB0 or COM3). Ignored when a device is selected above.
      required: false
      example: "/dev/ttyUSB0 or COM3"
      selector:
        text:
    baudrate:
      name: Baudrate (manual Serial only)
      description: Serial communication speed (usually 9600 for Growatt). Ignored when a device is selected above.
      required: false
      default: "9600"
      selector:
        select:
          options:
            - "4800"
            - "9600"
            - "19200"
            - "38400"
            - "57600"
            - "115200"
    slave_id:
      name: Slave ID (manual only)
      description: Modbus slave/unit ID (usually 1). Ignored when a device is selected above.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
    notify:
      name: Show Notification
      description: Display detection results as a persistent notification
      required: false
      default: true
      selector:
        boolean:
    offgrid_mode:
      name: OffGrid Mode (SPF Safety)
      description: "**⚠️ CRITICAL FOR SPF INVERTERS:** Enable this if you have an Off-Grid inverter (SPF 3000-6000 ES PLUS). Off-Grid inverters will experience a POWER RESET if this is disabled. Leave disabled for grid-tied inverters (MIN, SPH, MOD, WIT, etc.)"
      required: false
      default: false
      selector:
        boolean:
    scan_legacy:
      name: Scan Legacy Registers (0-249)
      description: "Restrict scan to: base and extended legacy registers (all models). Leave all scan options unchecked to scan every range (recommended)."
      required: false
      default: false
      selector:
        boolean:
    scan_storage:
      name: Scan Storage Registers (1000-1249)
      description: "Restrict scan to: storage blocks 1000-1124 and 1125-1249 (SPH, SPA, SPM, and MIN battery models)."
      required: false
      default: false
      selector:
        boolean:
    scan_mod_extended:
      name: Scan MIN/MOD Extended Registers (3000-3249)
      description: "Restrict scan to: extended data registers used by MIN and MOD series inverters."
      required: false
      default: false
      selector:
        boolean:
    scan_wit:
      name: Scan Extended/WIT Registers (875-999, 8000-8139)
      description: "Restrict scan to: the 875-999 extended block and WIT/WIS battery registers 8000-8139."
      required: false
      default: false
      selector:
        boolean:
    scan_vpp_control:
      name: Scan VPP Holding Blocks (30000-30999, 32000-32099)
      description: "Restrict scan to: VPP holding ranges. Enable Full Vendor Blocks to include every reserved word in the defined blocks."
      required: false
      default: false
      selector:
        boolean:
    scan_vpp_data:
      name: Scan VPP Input Blocks (31000-31599)
      description: "Restrict scan to: VPP input ranges for status, PV, grid, load, and battery information. Enable Full Vendor Blocks to include every reserved word in the defined blocks."
      required: false
      default: false
      selector:
        boolean:
    scan_full_vendor_blocks:
      name: Scan Full Vendor Blocks
      description: "Read complete vendor-defined blocks, including reserved and undocumented words. This is recommended when looking for new registers; it increases scan time."
      required: false
      default: false
      selector:
        boolean:
    scan_firmware_discovered:
      name: Scan ZABA22 Firmware-Discovered Ranges
      description: "Opt-in read-only scan of six FC03/FC04 windows recovered from the ZABA22 firmware dispatcher. These are candidates for live validation and may be unsupported on other firmware versions."
      required: false
      default: false
      selector:
        boolean:
    block_size:
      name: Block Size
      description: "Number of registers read per Modbus request. Leave unset to inherit the block size configured for the selected device, which is usually what you want. 125 is fastest; smaller values suit gateways or inverters that reject large reads."
      required: false
      default: 125
      selector:
        select:
          options:
            - label: "125 registers (default, fastest)"
              value: "125"
            - label: "50 registers"
              value: "50"
            - label: "25 registers (for finicky inverters)"
              value: "25"
            - label: "10 registers"
              value: "10"
            - label: "5 registers"
              value: "5"
            - label: "1 register (single-register scan, slowest)"
              value: "1"

write_register:
  name: Write Modbus Register
  description: Write a value to a specific Modbus holding register for advanced inverter control
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device
      required: true
      selector:
        device:
          integration: growatt_modbus
    register:
      name: Register Address
      description: Holding register address to write to (e.g., 0 for on/off, 3 for power rate, 30 for modbus address)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      name: Value
      description: Value to write to the register (as integer, already scaled if needed)
      required: true
      example: 1
      selector:
        number:
          min: -32768
          max: 65535
          mode: box

sync_inverter_time:
  name: Sync Inverter Clock
  description: >-
    Set the inverter's real-time clock from Home Assistant's local time. The inverter's
    clock drifts, and time-of-use windows fire against the inverter's idea of the time
    rather than yours, so a schedule set for 13:00 starts whenever the drifted clock
    reaches 13:00. Returns the drift that was corrected. Confirmed working on MIN TL-X and,
    with a different year encoding, on off-grid (SPF/SPE) models. Each field is written
    separately and the year goes first, so a refusal leaves your clock untouched rather
    than half-set.
  fields:
    device_id:
      name: Device
      description: The Growatt inverter whose clock should be set
      required: true
      selector:
        device:
          integration: growatt_modbus
    min_drift_seconds:
      name: Minimum drift
      description: >-
        Only write if the inverter is at least this many seconds out. Leave at 0 for a
        manual one-off sync. For a scheduled automation, set something like 30 so it only
        spends a write when there is drift worth correcting - these are holding registers
        and most likely have a finite write endurance.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

detect_grid_orientation:
  name: Detect Grid CT Orientation
  description: Automatically detect if your grid power CT clamp needs inversion for correct Home Assistant display. Run this when solar is producing and exporting to grid.
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device (optional - uses first found if not specified)
      required: false
      selector:
        device:
          integration: growatt_modbus

read_register:
  name: Read Register
  description: Read a specific Modbus register with detailed profile-aware output. Shows raw value, scale, paired register calculations, and entity values in a persistent notification.
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device
      required: true
      selector:
        device:
          integration: growatt_modbus
    register:
      name: Register Address
      description: Register address to read (e.g., 3 for PV1 voltage, 31201 for battery power)
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    register_type:
      name: Register Type
      description: Type of register to read
      default: "input"
      selector:
        select:
          options:
            - label: "Input Register (Read-Only Sensors)"
              value: "input"
            - label: "Holding Register (Settings/Control)"
              value: "holding"

set_battery_mode:
  name: Set Battery Mode (VPP)
  description: "Set battery charge/discharge/hold mode via VPP protocol registers (30xxx). Available on any model whose profile carries the VPP control registers 30100, 30407 and 30409 - WIT and WIS, and MOD/MID XH three-phase hybrids. CHARGE: Forces battery charging from grid+PV. DISCHARGE: Forces battery discharging to load. HOLD: Uses a TOU +1% workaround to bring the battery close to idle (simply disabling remote control returns to self-consumption, where the battery discharges). It is not an exact zero: at night with no PV, a MOD 10KTL3-XH (DTC 5400) settled at about 140 W charging. HOLD was designed for WIT/WIS; the action refuses any model whose profile lacks those three registers. RELEASE: hands control back to the inverter's own mode by clearing remote power control, the TOU schedule count and VPP control authority (30100). The other modes leave authority enabled, and authority with no active command can hold the inverter in standby instead of its selected mode. RELEASE needs only register 30100, so it also works on MIN TL-XH."
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device (WIT, WIS, or a MOD/MID XH carrying the VPP control registers)
      required: true
      selector:
        device:
          integration: growatt_modbus
    mode:
      name: Mode
      description: "Battery operating mode: charge, discharge, or hold"
      required: true
      selector:
        select:
          options:
            - label: "Charge (from grid+PV)"
              value: "charge"
            - label: "Discharge (to load)"
              value: "discharge"
            - label: "Hold (near idle)"
              value: "hold"
            - label: "Release (return control to the inverter)"
              value: "release"
    power_percent:
      name: Power Percentage
      description: Charge/discharge power as percentage of rated power (1-100%)
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

write_registers:
  name: Write Multiple Modbus Registers
  description: Write multiple consecutive holding registers using Modbus function 0x10. Required for atomic multi-register writes such as TOU period configuration.
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device
      required: true
      selector:
        device:
          integration: growatt_modbus
    register:
      name: Start Address
      description: Starting holding register address
      required: true
      example: 30412
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    values:
      name: Values
      description: List of values to write to consecutive registers
      required: true
      example: "[0, 120, 100]"
      selector:
        object:

set_tou_period:
  name: Set TOU Period
  description: "Set one time-of-use period on MOD / MID TL3-XH and MIN TL-XH (holding 3038-3059) in a single write: start, end, priority and enable together. Fields you leave out keep what the inverter holds. Nothing is written when the inverter already holds the requested values, so an automation can call this repeatedly without extra writes. Not for WIT (use Sync TOU Schedule) or SPH."
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device
      required: true
      selector:
        device:
          integration: growatt_modbus
    period:
      name: Period
      description: TOU period number, 1-9
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 9
          mode: box
    start:
      name: Start
      description: Period start time (HH:MM)
      required: false
      example: "01:00"
      selector:
        time:
    end:
      name: End
      description: Period end time (HH:MM)
      required: false
      example: "05:59"
      selector:
        time:
    priority:
      name: Priority
      description: What the inverter favours during the period
      required: false
      selector:
        select:
          options:
            - label: "Load first"
              value: "load"
            - label: "Battery first"
              value: "battery"
            - label: "Grid first"
              value: "grid"
    enabled:
      name: Enabled
      description: Whether the period is active
      required: false
      selector:
        boolean:

sync_tou_schedule:
  name: Sync TOU Schedule
  description: "Write Time-of-Use schedule to inverter for autonomous operation. The inverter will follow this schedule even if Home Assistant goes offline. Maximum 20 periods. CRITICAL: Periods CANNOT overlap! Use XX:59 end times (e.g., 119 for 01:59) then start next at XX:00 (e.g., 120 for 02:00). For HOLD mode, use power=1 (+1% charge brings the battery near idle - not an exact zero; see Set Battery Mode)."
  fields:
    device_id:
      name: Device
      description: The Growatt inverter device (WIT/WIS series)
      required: true
      selector:
        device:
          integration: growatt_modbus
    periods:
      name: Schedule Periods
      description: "List of TOU periods. CRITICAL: NO OVERLAPPING! Use XX:59 end times. power=1 for HOLD (near idle, not an exact zero), +100 for charge, -100 for discharge."
      required: true
      example: '[{"start": 0, "end": 119, "power": 100}, {"start": 120, "end": 1019, "power": 1}, {"start": 1020, "end": 1259, "power": -100}]'
      selector:
        object:
    default_mode:
      name: Default Mode
      description: "Behavior outside scheduled periods: 0=Load first (self-consumption/HOLD), 1=Battery first, 2=Grid first"
      required: false
      default: 0
      selector:
        select:
          options:
            - label: "Load first (self-consumption/HOLD)"
              value: "0"
            - label: "Battery first"
              value: "1"
            - label: "Grid first"
              value: "2"
